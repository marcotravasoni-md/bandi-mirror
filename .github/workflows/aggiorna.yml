name: Aggiorna bandi

on:
  workflow_dispatch:        # avvio manuale dal pulsante
  schedule:
    - cron: '0 5 * * *'     # ogni giorno alle 07:00 italiane

permissions:
  contents: write

env:
  WORKER: https://rapid-hat-ad56.marco-travasoni.workers.dev/

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scarica dal Worker a blocchi
        run: |
          BLOCCO=1000
          INIZIO=0
          rm -f parti.txt
          while [ $INIZIO -lt 20000 ]; do
            echo "Blocco da $INIZIO..."
            CODICE=$(curl -sS --max-time 120 -w '%{http_code}' \
                     "${WORKER}?rows=${BLOCCO}&start=${INIZIO}" -o "parte_${INIZIO}.json")
            if [ "$CODICE" != "200" ]; then
              echo "ERRORE HTTP $CODICE sul blocco da $INIZIO"
              head -c 300 "parte_${INIZIO}.json"
              exit 1
            fi
            RICEVUTI=$(python3 -c "import json;print(len(json.load(open('parte_${INIZIO}.json'))['response']['docs']))")
            echo "  ricevuti $RICEVUTI record"
            echo "parte_${INIZIO}.json" >> parti.txt
            [ "$RICEVUTI" -lt "$BLOCCO" ] && break
            INIZIO=$((INIZIO + BLOCCO))
            sleep 2
          done

      - name: Unisci i blocchi
        run: |
          python3 - <<'PY'
          import json
          record, totale = [], 0
          for nome in open('parti.txt').read().split():
              r = json.load(open(nome, encoding='utf-8'))['response']
              totale = r['numFound']
              record += r['docs']
          json.dump({'response': {'numFound': totale, 'docs': record}},
                    open('grezzo.json', 'w', encoding='utf-8'), ensure_ascii=False)
          print(f'Uniti {len(record)} record su {totale} dichiarati')
          PY

      - name: Pubblica
        run: |
          git config user.name "aggiornamento automatico"
          git config user.email "actions@github.com"
          git add bandi-aperti.json stato.json
          git diff --staged --quiet && echo "Nessuna modifica" && exit 0
          git commit -m "Aggiornamento bandi $(date +%F)"
          git push
